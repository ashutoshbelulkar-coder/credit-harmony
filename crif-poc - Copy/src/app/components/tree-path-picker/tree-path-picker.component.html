<div class="tree-path-picker-container">
  <div class="tree-section">
    <h4>Master Model Paths</h4>
    <div class="tree-nodes">
      <div *ngIf="treeNodes.length === 0" class="empty-message">
        No paths available
      </div>
      <ng-container *ngFor="let node of treeNodes">
        <app-tree-path-node
          [node]="node"
          [expanded]="isExpanded(node)"
          [depth]="0"
          (toggle)="toggleNode($event)"
          (selectPath)="selectPath($event)">
        </app-tree-path-node>
      </ng-container>
    </div>
  </div>

  <div class="manual-entry-section">
    <h4>Or Enter Manually</h4>
    <textarea
      class="manual-path-input"
      placeholder="Enter custom path (e.g., company.name)"
      [ngModel]="manualPath"
      (ngModelChange)="onManualPathChange($event)"></textarea>
    <p class="hint">Use dot notation for nested fields (e.g., BasicInformation.CompanyName)</p>
    <p class="hint">Use [*] for array paths (e.g., Managers.ManagerData[*].Name)</p>
  </div>
</div>
