<div class="tree-node" [style]="indentStyle">
  <div class="node-header" [class.clickable]="hasChildren" (click)="onHeaderClick($event)">
    <button *ngIf="hasChildren" class="toggle-btn" (click)="onToggle($event)" [class.expanded]="isExpanded">
      {{ isExpanded ? '▼' : '▶' }}
    </button>
    <span *ngIf="!hasChildren" class="toggle-spacer"></span>

    <span class="node-icon">
      {{ nodeIcon }}
    </span>

    <span class="node-label">
      {{ node.key }}
    </span>

    <button *ngIf="node.isLeaf && showSelectButton" class="select-btn" (click)="onSelectPath(node.fullPath, $event)"
      title="Select this path">
      Select
    </button>
  </div>

  <div class="node-children" *ngIf="isExpanded && hasChildren">
    <ng-container *ngFor="let child of node.children">
      <app-tree-path-node [node]="child" [depth]="depth + 1" [expandedNodes]="expandedNodes"
        (toggle)="onChildToggle($event)" (selectPath)="onChildSelectPath($event)">
      </app-tree-path-node>
    </ng-container>
  </div>
</div>
